<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans&family=Pirata+One&family=Playfair+Display:ital@1&family=Space+Mono:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!--content section-->
    
    <div class="content_section">

      <!--home section-->
      <section id="home" class="content">
        <div class="selector">
          <button id="intro_btn" class="active">Intro</button>
          <span class="separator">•</span>
          <button id="beyond_btn">Beyond</button>
        </div>

        <div class="slider_viewport">
          <div class="slider_track" id="home_slider">
            <div class="slide">
              <div class="my_intro">
                <span>
                I
                <span class="highlighted" id="build">Build</span>
                ,
                <span class="highlighted" id="deploy">Deploy</span>
                and
                <br>
                <span class="highlighted" id="scale">Scale</span>
                <br>
                <span>End to End.</span>
                <br>
                <br>
                <span class="identity">Hi! I'm Aritra Kumar, aka cyphenstyne.</span>
                </span>
              </div>
            </div>
            <div class="slide">
              <p>Beside being a software engineer I also like cooking, playing video games.</p>
            </div>
          </div>
        </div>
      </section>

      <!--portfolio section-->
      <section id="portfolio" class="content">
        <h1>Portfolio</h1>
      </section>

      <!--blogs section-->
      <section id="blogs" class="content">
        <h1>Blogs</h1>
      </section>
    </div>

    <!--main nav bar section-->
    
    <div class="nav_bar_section">
      <nav class="nav_bar">
        <a href="#home">Home</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#blogs">Blogs</a>
      </nav>
    </div>
    
    <script src="slider.js" defer></script>
  </body>
</html>
